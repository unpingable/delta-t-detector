[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-t-detector"
version = "2.0.0"
description = "Hallucination detection through temporal coherence analysis"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "James Beck"}]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
]

[project.optional-dependencies]
full = [
    "sentence-transformers>=2.2.0",
    "python-Levenshtein>=0.21.0",
    "aiohttp>=3.8.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
]
api = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/unpingable/delta-t-detector"
Repository = "https://github.com/unpingable/delta-t-detector"

[tool.setuptools.packages.find]
include = ["detector*"]
